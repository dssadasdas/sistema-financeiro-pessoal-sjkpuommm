<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>Semeia — Sistema Financeiro Pessoal</title>
    <meta
      name="description"
      content="Semeia: organize receitas, despesas, cartões de crédito, contas a pagar, orçamentos, metas e investimentos com a ajuda de uma IA financeira pessoal."
    />
    <meta name="author" content="Semeia" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Semeia" />
    <meta property="og:title" content="Semeia — Sistema Financeiro Pessoal" />
    <meta
      property="og:description"
      content="Controle sua vida financeira em um só lugar: receitas, despesas, cartões, metas, orçamentos e investimentos com IA."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Semeia — Sistema Financeiro Pessoal" />
    <meta
      name="twitter:description"
      content="Controle sua vida financeira em um só lugar com a ajuda de uma IA financeira pessoal."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Prevent theme flash: apply saved/preferred theme before first paint -->
    <script>
      ;(function () {
        try {
          var key = 'semeia-theme'
          var saved = localStorage.getItem(key)
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
